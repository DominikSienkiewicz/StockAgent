# SonarCloud / SonarQube configuration for StockAgent.
# projectKey / organization confirmed against the SonarCloud project.
sonar.projectKey=DominikSienkiewicz_StockAgent
sonar.organization=dominiksienkiewicz
sonar.host.url=https://sonarcloud.io

# Entry points (DI containers) are main code too (CI-04); list every main_*.py
# explicitly — tests/test_quality_gate_sync.py fails when one is missing.
sonar.sources=src,main_agent.py,main_backtest.py,main_deadman.py,main_scorecard.py,main_tools.py,main_trainer.py,main_watch.py
sonar.tests=tests

sonar.python.version=3.12

# --- Code coverage ---
#
# SonarCloud runs the scan on its own runner and does NOT execute our pytest suite,
# so without an uploaded report it sees the new code with zero coverage and reports
# 0.0% — failing the "Sonar way" gate (>= 80% coverage on new code). The CI
# `sonarcloud` job runs `pytest --cov=src --cov=main_<x> … --cov-report=xml` and hands this report to
# the scanner. Path is relative to the repo root (sonar.projectBaseDir).
sonar.python.coverage.reportPaths=coverage.xml
