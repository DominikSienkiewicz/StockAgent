[project]
name = "stock-agent"
version = "0.1.0"
description = "Autonomous financial agent — agentic RAG, an LLM advisory council and self-reflection against realised prices"
readme = "README.md"
# CI-28: tylko minor testowany w CI (ci.yml, mypy, ruff celują w 3.12); nowy Python = świadoma
# zmiana tej granicy, locka i CI razem — pilnuje tests/test_dependency_bounds.py.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Dominik Sienkiewicz" }]
license = { text = "MIT" }

dependencies = [
    # CI-12: dolna granica = najniższa wersja, którą instaluje i testuje job `lowest-direct`
    # w ci.yml; tests/test_dependency_bounds.py pilnuje, że ma ten sam major co uv.lock.
    # Graf agenta (StateGraph Fast Loopa). RAG to własny kod na pgvector, bez langchain.
    "langgraph>=1.2,<2",
    # Data & DB
    "supabase>=2.30",            # supabase-py wydaje pakiety w lockstepie z postgrest
    "postgrest>=2.30",           # importowany wprost (APIError) w supabase_repo.py
    "httpx>=0.26",               # transport PostgREST; importowany wprost (ARCH-33) w supabase_repo.py
    "pydantic>=2.11.7",          # niżej lowest-direct nie schodzi (wymogi zależności przechodnich)
    "pydantic-settings>=2.2.0",
    # ML (Slow Loop)
    "xgboost>=3.0",
    "scikit-learn>=1.4.2",       # wymagane przez xgboost.XGBRegressor (sklearn API); 1.4.2 = numpy 2
    "pandas>=3.0",
    "numpy>=2.0",
    # Utilities
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.6",
    # LLM — główna analiza na Claude (`llm_provider = "anthropic"` w config.toml),
    # więc SDK jest rdzeniem, nie opcją: Slow Loop (weekly recap) też go buduje.
    # Górne granice SDK: anthropic 2.x wysyła API `2026-10-21`, które odrzuca `temperature`
    # (adapter wysyła 0.2 przez `extra_body`, bez niej Claude próbkuje z 1.0).
    # Nowy major to świadoma migracja adapterów, nie cotygodniowe podbicie Dependabota.
    "anthropic>=1.13,<2",
    "urllib3>=2.7",
    # Rada doradcza (gpt-5-mini), embeddingi i failover LLM — adaptery importują SDK wprost.
    "openai>=3.29,<4",
    # WIA-73: podpis keyless rootu cyklu (klucz P-256, CSR do Fulcio) i odczyt certyfikatu
    # w verify-attestation. Był już w drzewie (supabase-auth[crypto] → pyjwt[crypto]),
    # deklaracja nie dokłada żadnego pakietu.
    "cryptography>=50",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "testcontainers>=4.14.2",
    "psycopg2-binary>=2.9.12",
    "httpx>=0.28.1",
    # Wyjątki SDK LLM (anthropic 1.x, openai 3.x) niosą `httpx2.Request`/`Response`, więc
    # testy budują je z httpx2; `httpx` zostaje dla transportu PostgREST.
    "httpx2>=2.0",
    "pyyaml>=6.0.3",
    "docker>=7.1.0",
    "pytest-socket>=0.8.1",
    # Przypięta wersja wydana co najmniej 2 tygodnie przed dodaniem (6.168.5 z 2026-10-05):
    # świeże wydanie nie trafia do lockfile'a, zanim przeleży swoje. Podbijamy świadomie.
    "hypothesis==6.169.0",
    "jsonschema>=4.26.0",
    # Stuby typów `yaml` dla strażników workflowów i konfiguracji (TEST-24): bez nich
    # ratchet mypy po katalogach tests/ (TEST-13) widziałby `yaml` jako Any.
    "types-pyyaml>=6.0.12.20260906",
]

# Alias wstecznej zgodności: SDK jest już zależnością rdzeniową, ale
# `uv sync --extra anthropic` w CI i w workflowach dalej działa.
[project.optional-dependencies]
anthropic = ["anthropic>=1.13,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # TEST-11: testy jednostkowe bez sieci; `integration` i `containers` dostają
    # ją z powrotem w tests/conftest.py. Gniazda unixowe zostają dla Dockera.
    "--disable-socket",
    "--allow-unix-socket",
]
markers = [
    "integration: testy integracyjne (sieć / DB) — pomijalne lokalnie",
    "containers: testy z Docker (testcontainers) — wymagają działającego demona Docker",
]

# ---------------------------------------------------------------------------
# coverage (CI-03): próg z gałęziami na src/domain, z zapadką
# ---------------------------------------------------------------------------
# Zmierzone 2026-10-24: 98,49% gałęzi i instrukcji src/domain. Próg tylko rośnie;
# `--cov-fail-under` w jobie quality (ci.yml) i `COVERAGE_RATCHET` w
# tests/test_quality_gate_sync.py muszą się z nim zgadzać.
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 98

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF100",  # ARCH-22: martwe `# noqa` (także kody reguł spoza `select`, np. BLE)
]

[tool.ruff.lint.isort]
# Katalog `supabase/` (migracje dla CLI) w rootcie sprawia, że isort bierze
# pakiet PyPI `supabase` za first-party i wrzuca go do grupy z `src.*`.
# To zależność zewnętrzna — trzymamy ją w grupie third-party.
known-third-party = ["supabase"]

# ---------------------------------------------------------------------------
# mypy (type checker)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# CI-15: goły `# type: ignore` (bez kodu błędu) ucisza każdy błąd w linii — mypy go odrzuca;
# liczbę ignore z kodem i `cast(Any, …)` pilnuje zapadka w tests/test_quality_gate_sync.py.
enable_error_code = ["ignore-without-code"]
strict = true
plugins = ["pydantic.mypy"]
# Gołe `uv run mypy` = bramka CI. Cały `tests/` jest pod strict (TEST-13, ratchet po
# katalogach domknięty 2026-10-25): katalogi wymienione z nazwy + `tests/*.py` dla
# top-levelu. Samo "tests" daje duplikaty modułów obok katalogów. Wpisu nie wolno
# zdjąć, a nowy katalog testów trzeba dopisać — pilnuje tego tests/test_quality_gate_sync.py.
files = ["src", "main_agent.py", "main_backtest.py", "main_bot.py", "main_deadman.py", "main_scorecard.py", "main_tools.py", "main_trainer.py", "main_watch.py", "tests/domain", "tests/tools", "tests/infrastructure", "tests/application", "tests/*.py"]

# ARCH-22: brak stubów wyciszony tylko dla bibliotek, które ich nie mają (pandas bez
# pandas-stubs, jsonschema, psycopg2, docker i testcontainers tylko w testach
# kontenerowych). Nowa biblioteka bez stubów to błąd mypy, a nie cichy `Any`.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "jsonschema", "jsonschema.*", "psycopg2", "psycopg2.*", "docker", "docker.*", "testcontainers.*"]
ignore_missing_imports = true

# ARCH-22: plugin pydantic syntezuje `__init__` modeli i `BaseSettings` (pola opcjonalne,
# bo przychodzą z env; zna `_env_file`). Typowane argumenty i zakaz nieznanych pól
# trzymają `Settings(...)` w testach pod tą samą kontrolą co dotąd.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
