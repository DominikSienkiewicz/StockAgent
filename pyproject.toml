[project]
name = "stock-agent"
version = "0.1.0"
description = "Autonomous Financial Agent — Agentic RAG + Continual Learning"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dominik Sienkiewicz" }]
license = { text = "MIT" }

dependencies = [
    # Agentic Framework & RAG
    "langchain>=0.1.16",
    "langchain-openai>=0.1.3",
    "langgraph>=0.0.39",
    # Data & DB
    "supabase>=2.4.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # ML (Slow Loop)
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",       # wymagane przez xgboost.XGBRegressor (sklearn API)
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Utilities
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "testcontainers>=4.14.2",
    "psycopg2-binary>=2.9.12",
]

# Opcjonalna grupa pod przełączenie na Anthropic Claude
# Instalacja: uv sync --extra anthropic
[project.optional-dependencies]
anthropic = ["anthropic>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: testy integracyjne (sieć / DB) — pomijalne lokalnie",
    "containers: testy z Docker (testcontainers) — wymagają działającego demona Docker",
]

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# HTML templating w report_builder ma długie linie z naturalnym stylem inline —
# łamanie ich pogarsza czytelność.
"src/application/report_builder.py" = ["E501"]

# ---------------------------------------------------------------------------
# mypy (type checker)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]
