name: 🔵 Slow Loop (Weekly ML Retraining)

on:
  schedule:
    # Niedziela 03:00 UTC — niskie obciążenie serwerów
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write   # KRYTYCZNE — job musi pushować zaktualizowany .ubj

jobs:
  retrain-predictive-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Token z prawem zapisu (default GITHUB_TOKEN wystarcza
          # przy ustawionym permissions.contents=write powyżej)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: 📦 Sync dependencies
        run: uv sync --frozen --no-build --no-install-project

      - name: 📈 Train XGBoost on prediction_logs
        env:
          # Slow Loop potrzebuje TYLKO dostępu do bazy (least privilege).
          # Symbole i ml_model_path czyta z config.toml (commitowany).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # #17: niedzielna retrospektywa woła LLM (dokładnie RAZ) i wysyła mail,
          # więc przy `weekly_recap_enabled = true` te sekrety muszą być realne.
          # Z flagą off recap nie startuje i dummy w zupełności wystarczą.
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL:   ${{ secrets.DIGEST_TO_EMAIL }}
          # Dummy — trener ich nie używa, ale Settings wymaga pól.
          FINNHUB_API_KEY:        unused-in-slow-loop
          ALPHA_VANTAGE_API_KEYS: unused-in-slow-loop
        run: uv run --frozen --no-build --no-sync python main_trainer.py

      - name: 💾 Commit and push updated model
        run: |
          git config --global user.name "AI Model Trainer"
          git config --global user.email "ml-trainer@users.noreply.github.com"

          MODEL_PATH="data/models/price_predictor.ubj"

          if [ ! -f "$MODEL_PATH" ]; then
            echo "Trener nie wyprodukował pliku modelu (prawdopodobnie za mało danych) — pomijam commit."
            exit 0
          fi

          git add "$MODEL_PATH"
          if git diff --cached --quiet -- "$MODEL_PATH"; then
            echo "Brak zmian w modelu wag po treningu."
          else
            git commit -m "chore(ml): update XGBoost model weights [skip ci]"
            git push
          fi
