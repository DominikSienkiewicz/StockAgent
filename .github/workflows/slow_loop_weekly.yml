name: 🔵 Slow Loop (Weekly ML Retraining)

on:
  schedule:
    # Niedziela 03:00 UTC — niskie obciążenie serwerów
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read    # BEZ-12: zapis dostaje wyłącznie job trenera, nie cały workflow

# CI-13: dwa treningi naraz (cron + ręczne wymuszenie) nadpisywałyby sobie asset
# wag. Drugi run czeka w kolejce — anulowanie w połowie uploadu zostawiłoby
# Release bez pliku.
concurrency:
  group: slow-loop
  cancel-in-progress: false

jobs:
  retrain-predictive-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # CI-13: tworzy Release `model-latest` i podmienia jego asset wag

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Upload wag idzie domyślnym GITHUB_TOKEN z `contents: write` tego joba.
          fetch-depth: 1

      - name: 🙈 Mask each Alpha Vantage key
        # BEZ-03: GitHub maskuje sekret CSV tylko w całości — pojedynczy klucz z listy
        # wyszedłby w logu jawnie. Maskujemy każdy osobno, zanim ruszy Python.
        env:
          ALPHA_VANTAGE_API_KEYS: ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
        run: scripts/mask-csv-secret.sh ALPHA_VANTAGE_API_KEYS

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: 📦 Sync dependencies
        run: uv sync --frozen --no-build --no-install-project

      - name: 🔐 Install age (evidence backup)
        # NIEZ-32: kopia tabel dowodowych jest szyfrowana `age` kluczem odbiorcy przed
        # zapisem. Bez sekretu krok nic nie instaluje, a trener pomija kopię z WARNING-iem.
        # Awaria apt nie może zablokować treningu — kopia wtedy po prostu nie powstaje.
        continue-on-error: true
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -n "$BACKUP_AGE_RECIPIENT" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq age
          else
            echo "BACKUP_AGE_RECIPIENT not set — evidence backup skipped"
          fi

      - name: 📈 Train XGBoost on prediction_logs
        env:
          # Slow Loop: baza, Alpha Vantage (fundamenty), LLM i Resend (recap).
          # Symbole i ml_model_path czyta z config.toml (commitowany).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # BEZ-08: Settings domyślnie NIE zapisuje do bazy (lokalny run tylko do
          # odczytu) — scorecardy, cache fundamentów, kalibracja i alerty kwot
          # wymagają jawnego włączenia. Pilnuje tego tests/test_db_writes_wiring.py.
          DB_WRITES_ENABLED: "true"
          # FIN-35: bez tego fundamenty AV nie są odświeżane, a recap i sędzia
          # kalibracji dostają atrapę LLM. Pilnuje tego tests/test_paid_calls_wiring.py.
          PAID_CALLS_ENABLED: "true"
          # #17: niedzielna retrospektywa woła LLM (dokładnie RAZ) i wysyła mail,
          # więc przy `weekly_recap_enabled = true` te sekrety muszą być realne.
          # Z flagą off recap nie startuje i dummy w zupełności wystarczą.
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL:   ${{ secrets.DIGEST_TO_EMAIL }}
          # Odświeżanie fundamentów pyta Alpha Vantage — potrzebny prawdziwy klucz.
          ALPHA_VANTAGE_API_KEYS: ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          # Dummy — trener nie pyta Finnhuba, ale Settings wymaga pola.
          FINNHUB_API_KEY: unused-in-slow-loop
          # NIEZ-13: zewnętrzny heartbeat (np. healthchecks.io) — ping na koniec przebiegu,
          # porażka → <URL>/fail. Brak sekretu = pusty string = NullHeartbeat (zero requestów).
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          # NIEZ-25: CRITICAL sondy modeli idzie pushem (przy realtime_alerts_enabled).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          # NIEZ-32: klucz publiczny age odbiorcy kopii; brak = kopia pominięta.
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: uv run --frozen --no-build --no-sync python main_trainer.py

      - name: 📦 Upload encrypted evidence backup
        # NIEZ-32: wyłącznie szyfrogram *.age — artefakt publicznego repo pobierze każdy
        # zalogowany. Bez pliku (brak sekretu, błąd kopii) krok nic nie wysyła.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-backup-${{ github.run_id }}
          path: data/backup/*.age
          retention-days: 90
          if-no-files-found: ignore

      - name: 💾 Upload model weights (Release model-latest)
        # CI-13 (G78): wagi idą jako asset Release `model-latest`, nie commit na main —
        # bot nie omija branch protection, a binaria nie puchną w historii gita.
        # Fast Loop pobiera ten asset przed runem. Asset jest nadpisywany co tydzień,
        # więc sha256 trafia do notatek Release i podsumowania joba; predykcje niosą
        # go w przepisie (`model_version`, WIA-20).
        # ML-04: trener kończy się exit 1, gdy padł choć jeden symbol — wagi wspólnego
        # modelu, jeśli powstały, i tak trzeba zapisać. Anulowanie (timeout) pomija krok.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL_PATH: data/models/price_predictor.ubj
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Plik wag nie jest w repo, więc istnieje tylko, gdy ten run go wytrenował.
          if [ ! -f "$MODEL_PATH" ]; then
            echo "Trener nie wyprodukował pliku modelu (bramka albo za mało danych) — pomijam upload."
            exit 0
          fi

          SHA256=$(sha256sum "$MODEL_PATH" | cut -d' ' -f1)
          NOTES="sha256: ${SHA256} · trening: ${RUN_URL}"
          if ! gh release view model-latest >/dev/null 2>&1; then
            gh release create model-latest --title "Model weights (latest)" \
              --notes "$NOTES" --latest=false
          fi
          gh release upload model-latest "$MODEL_PATH" --clobber
          gh release edit model-latest --notes "$NOTES"
          echo "Wagi modelu w Release model-latest, sha256: ${SHA256}" >> "$GITHUB_STEP_SUMMARY"

      - name: 📮 Mail o porażce jobu
        # NIEZ-23: GitHub mailuje o porażce crona tylko autora ostatniej zmiany crona,
        # a timeout i anulowanie są ciche. Bez Pythona — działa też, gdy padło `uv sync`.
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"
