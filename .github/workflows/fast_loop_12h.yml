name: 🟢 Fast Loop (daily Agentic RAG)

on:
  # Codzienny cykl wznowiony 2026-10-23 (docs/resume-checklist.md, krok 10);
  # pauza trwała od 2026-08-17 (`02fc397`, decyzja 2).
  schedule:
    # 05:30 UTC = 07:30 CEST (lato) / 06:30 CET (zima)
    # GHA cron jest fixed-UTC i nie ma DST — w październiku przy zmianie czasu
    # na CET godziny przesuwają się o 1h wstecz w czasie polskim.
    # Aby zachować 7:30 PL przez cały rok, zmień na '30 6' w CET.
    # GHA cron to best-effort — opóźnienia 5-60 min są normalne.
    # Tylko dni robocze (pon-pt) — w weekendy giełda jest zamknięta.
    # Święta NYSE pomija sam agent (FIN-34, `nyse_closure_skip_enabled` w config.toml):
    # w dzień zamknięcia akcje nie idą do grafu, krypto tak; cron zostaje `1-5`.
    - cron: '30 5 * * 1-5'
  workflow_dispatch:   # ręczne wymuszenie z panelu Actions

permissions:
  contents: read       # tylko czytamy kod; Fast Loop nie pisze do repo
  # WIA-16: `pages: write` / `id-token: write` ma wyłącznie job `deploy-scorecard`.
  # WIA-14: `contents: write` ma wyłącznie job `publish-attestation-ledger` (push na
  # gałąź `attestation-log`, nigdy na main) i ani jednego klucza API.

# Zapobiega overlapowi: jeśli opóźniony pierwszy run trwa nadal gdy ruszy
# drugi (GHA cron bywa best-effort, opóźnienia 5-60 min są normalne), drugi czeka
# w kolejce. FIN-18: NIE anulujemy — run w toku mógł już zapłacić za LLM, a
# anulowanie przerywałoby też push ledgera atestacji (WIA-14). Kolejka może
# opóźnić następny run o czas poprzedniego (limit 15 min), ale nie marnuje wydatku.
concurrency:
  group: fast-loop
  cancel-in-progress: false

jobs:
  run-market-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # FinOps: twardy limit, by zawieszony job nie zjadał minut
    outputs:
      # WIA-16: `success` tylko wtedy, gdy powstał artefakt Pages publicznego scorecardu.
      scorecard: ${{ steps.scorecard-artifact.outcome }}
      # WIA-14: czy agent dopisał coś do ledgera atestacji i od którego commitu gałęzi
      # `attestation-log` zaczął (push zaczyna od tego commitu, nie od bieżącego końca).
      ledger_changed: ${{ steps.ledger-changes.outputs.changed }}
      ledger_base: ${{ steps.ledger-changes.outputs.base }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🔎 Check the attestation-log branch
        # WIA-14: ledger JSONL jest append-only, więc agent musi dopisywać do checkoutu
        # gałęzi `attestation-log`. Na świeżym runnerze bez checkoutu `FileAttestationPublisher`
        # (tryb "a") zaczynałby pusty plik i push zgubiłby historię. Gałąź tworzy właściciel
        # (docs/resume-checklist.md, krok 9): do tego czasu flaga `attestation_enabled`
        # jest off i cykl biegnie jak dotąd. Flaga on bez gałęzi = błąd PRZED płatnymi wywołaniami.
        id: ledger-branch
        run: |
          if git ls-remote --exit-code --heads origin attestation-log >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^attestation_enabled[[:space:]]*=[[:space:]]*true' config.toml; then
            echo "::error title=StockAgent::attestation_enabled = true, ale brak gałęzi attestation-log (docs/resume-checklist.md, krok 9)"
            exit 1
          else
            echo "::notice title=StockAgent::Brak gałęzi attestation-log — ledger atestacji nie jest checkoutowany (attestation_enabled = false)"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📚 Checkout the attestation ledger (attestation-log)
        id: ledger-checkout
        if: steps.ledger-branch.outputs.exists == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Katalog z `attestation_commitments_path` i `attestation_reveals_path` (config.toml);
          # pilnuje tego tests/test_workflow_env_wiring.py. Job agenta nie ma prawa zapisu,
          # więc token nie zostaje w configu tego checkoutu.
          ref: attestation-log
          path: public/attestation
          fetch-depth: 1
          persist-credentials: false

      - name: 🙈 Mask each Alpha Vantage key
        # BEZ-03: GitHub maskuje sekret CSV tylko w całości — pojedynczy klucz z listy
        # wyszedłby w logu jawnie. Maskujemy każdy osobno, zanim ruszy Python.
        env:
          ALPHA_VANTAGE_API_KEYS: ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
        run: scripts/mask-csv-secret.sh ALPHA_VANTAGE_API_KEYS

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true   # cache zależności między uruchomieniami

      - name: 📦 Sync dependencies
        # SDK anthropic jest zależnością rdzeniową (analiza główna chodzi na Claude);
        # `--extra anthropic` to zachowany alias, pilnowany przez test_workflow_env_wiring.
        run: uv sync --frozen --extra anthropic --no-build --no-install-project

      - name: 📦 Download model weights (Release model-latest)
        # CI-13: wagi XGBoost trzyma Release `model-latest` (upload w Slow Loopie), nie
        # repo. Brak Release albo assetu (przed pierwszym modelem, który przeszedł
        # bramkę) = cold start, jak bez pliku wag: agent leci na baseline, a przepis
        # predykcji zapisuje `model_version = cold_start` zamiast sha256 wag.
        # Sam odczyt — wystarcza `contents: read` workflowu.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release download model-latest --pattern price_predictor.ubj \
              --dir data/models --clobber; then
            sha256sum data/models/price_predictor.ubj
          else
            echo "::warning::Brak wag w Release model-latest — Fast Loop bez modelu ML (cold start)."
          fi

      - name: 🧠 Run Agent (LangGraph + XGBoost + LLM)
        # Tu wstrzykujemy WYŁĄCZNIE sekrety (plus przełączniki DB_WRITES_ENABLED
        # i PAID_CALLS_ENABLED niżej).
        # Cały config niewrażliwy (symbole, progi, modele, providerzy, throttle, risk
        # watch…) jest w commitowanym `config.toml` i czytany wprost przez Settings —
        # bez mapowania vars.*, więc nie ma już driftu .env ↔ workflow ani repo
        # variables do pilnowania.
        env:
          # Database
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}
          # BEZ-08: jedyny niesekret w env — Settings domyślnie NIE zapisuje do bazy
          # (lokalny run tylko do odczytu), więc job produkcyjny włącza zapis jawnie.
          # Pilnuje tego tests/test_db_writes_wiring.py.
          DB_WRITES_ENABLED:      "true"
          # FIN-35: Settings domyślnie podstawia atrapy płatnych portów (lokalny run
          # bez płatnych wywołań), więc job produkcyjny włącza je jawnie.
          # Pilnuje tego tests/test_paid_calls_wiring.py.
          PAID_CALLS_ENABLED:     "true"
          # LLM — analiza główna na Anthropic, embeddingi + rada na OpenAI
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          # Krzywa rentowności (FRED) — darmowy klucz, wymagany przy yield_curve_enabled.
          # Bez niego build_macro_rates_port wpada w Null adapter i głos krzywej nie powstaje.
          FRED_API_KEY:           ${{ secrets.FRED_API_KEY }}
          # Market data + News/Sentiment
          FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEYS: ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          # Email (odbiorca = sekret; nadawca + włącznik w config.toml)
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL:        ${{ secrets.DIGEST_TO_EMAIL }}
          # Kanały push (skrót digestu, alerty kwot). Brak sekretu = kanał nie powstaje;
          # bez mapowania włączony `messenger_digest_enabled` milczał po cichu (MAIL-04).
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
          # NIEZ-13: zewnętrzny heartbeat (np. healthchecks.io) — ping na koniec przebiegu,
          # porażka → <URL>/fail. Brak sekretu = pusty string = NullHeartbeat (zero requestów).
          HEARTBEAT_URL:          ${{ secrets.HEARTBEAT_URL }}
        run: uv run --frozen --no-build --no-sync python main_agent.py

      - name: 🔍 Detect new ledger lines
        id: ledger-changes
        # `!cancelled()`: agent kończy się exit 1, gdy padły wszystkie symbole, a predykcje
        # zapisane wcześniej mają już commitment w bazie — jego hash musi trafić do ledgera.
        if: ${{ !cancelled() && steps.ledger-checkout.outcome == 'success' }}
        run: |
          echo "base=$(git -C public/attestation rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git -C public/attestation status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload attestation ledger (for the publish job)
        if: ${{ !cancelled() && steps.ledger-changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attestation-ledger
          path: |
            public/attestation/commitments.jsonl
            public/attestation/reveals.jsonl
          if-no-files-found: ignore
          retention-days: 7   # jedyna kopia nowych linii, gdyby push padł

      - name: 📤 Upload public scorecard (Pages artifact)
        id: scorecard-artifact
        # WIA-16: wyłącznie katalog scorecardu (dirname `public_scorecard_path`), nigdy
        # `public/` — leży tam też dziennik atestacji. Flaga off albo puste okno = brak
        # pliku, więc brak artefaktu i deployu.
        if: hashFiles('public/scorecard/index.html') != ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public/scorecard

      - name: 📮 Mail o porażce jobu
        # NIEZ-23: GitHub mailuje o porażce crona tylko autora ostatniej zmiany crona,
        # a timeout i anulowanie są ciche. Bez Pythona — działa też, gdy padło `uv sync`.
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"

  publish-attestation-ledger:
    # WIA-14: jedyny job z `contents: write` i bez żadnego klucza API (poza mailem o jego
    # porażce). Dokłada linie agenta do `attestation-log`: commit `[skip ci]`, `pull --rebase`
    # z ponowieniami, push wyłącznie na tę gałąź — nigdy na main. Branch protection gałęzi
    # (bez force-push i delete) ustawia właściciel: docs/resume-checklist.md, krok 9.
    needs: run-market-agent
    if: ${{ !cancelled() && needs.run-market-agent.outputs.ledger_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Kolejka, nie anulowanie: przerwany push zostawiłby commitmenty tylko w bazie.
    concurrency:
      group: attestation-ledger
      cancel-in-progress: false
    env:
      LEDGER_BASE: ${{ needs.run-market-agent.outputs.ledger_base }}

    steps:
      - name: 📥 Checkout repository
        # Tylko skrypt alertu o porażce — bez tokenu w configu.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 📚 Checkout the attestation ledger (attestation-log)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Pełna historia: rebase potrzebuje wspólnego przodka z commitem, od którego
          # zaczął agent. Token tego jobu (contents: write) służy tylko do pusha.
          ref: attestation-log
          path: public/attestation
          fetch-depth: 0

      - name: 📥 Download attestation ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: attestation-ledger
          path: ledger-artifact

      - name: 📮 Commit and push the ledger
        run: |
          set -euo pipefail
          git -C public/attestation config user.name "github-actions[bot]"
          git -C public/attestation config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Dwa dopisania na końcu tego samego pliku (inny przebieg zdążył wypchnąć wcześniej)
          # łączą się bez konfliktu: rebase bierze linie z obu stron.
          mkdir -p public/attestation/.git/info
          printf '*.jsonl merge=union\n' >> public/attestation/.git/info/attributes
          # Zaczynamy od commitu, który agent dopisywał; bieżący koniec gałęzi dołoży rebase.
          git -C public/attestation checkout --quiet -B ledger-update "$LEDGER_BASE"
          cp ledger-artifact/*.jsonl public/attestation/
          touch public/attestation/commitments.jsonl public/attestation/reveals.jsonl
          git -C public/attestation add commitments.jsonl reveals.jsonl
          if git -C public/attestation diff --cached --quiet; then
            echo "Ledger bez zmian — nic do wypchnięcia."
            exit 0
          fi
          git -C public/attestation commit --quiet -m "ledger: run ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git -C public/attestation pull --rebase --quiet origin attestation-log
            if git -C public/attestation push --quiet origin HEAD:attestation-log; then
              echo "Ledger wypchnięty (próba ${attempt})."
              exit 0
            fi
            sleep "$((attempt * ${LEDGER_RETRY_DELAY_SECONDS:-3}))"
          done
          echo "::error title=StockAgent::Ledger atestacji nie został wypchnięty na attestation-log"
          exit 1

      - name: 📮 Mail o porażce jobu
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"

  deploy-scorecard:
    # WIA-16: osobny job — tylko on dostaje uprawnienia Pages. Deploy podmienia całą
    # witrynę, więc idzie tędy wyłącznie strona scorecardu, nigdy JSONL atestacji.
    needs: run-market-agent
    if: needs.run-market-agent.outputs.scorecard == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read     # checkout skryptu alertu
      pages: write       # deploy artefaktu Pages
      id-token: write    # OIDC, którego wymaga actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Jedna kolejka `pages` dla każdego deployu Pages w repo — dwa naraz się wykluczają.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🌐 Deploy public scorecard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: 📮 Mail o porażce jobu
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"
