name: 🚨 Shock Watch (hourly, free)

on:
  # Harmonogram wznowiony 2026-10-23 (wstrzymany od 2026-10-16, `f886da0`). Od ALR-02
  # watch działa SAM, bez Fast Loopa (fast_loop_12h.yml): ruch liczy z dziennej zmiany
  # darmowego /quote (Finnhub `dp`, CoinGecko zmiana 24 h), a snapshot Fast Loopa
  # jest tylko fallbackiem. Watch nigdy nie zapisuje snapshotu ceny. Strażnik
  # `tests/test_shock_watch_env_wiring.py` pilnuje, że cron bez Fast Loopa ma
  # okablowane źródło dziennej zmiany. Ręczne wymuszenie z panelu Actions zostaje.
  #
  # Watch jest zaprojektowany pod 24/7, NIE tylko sesję NYSE — BTC/ETH handlują
  # całą dobę. Wymaga migracji 021 i `shock_alerts_enabled = true`.
  # W dzień zamknięcia NYSE (święto, weekend) watch sam pomija akcje i sprawdza samo
  # krypto (FIN-34, `nyse_closure_skip_enabled` w config.toml) — cron zostaje 24/7.
  schedule:
    - cron: '7 * * * *'   # co godzinę, o :07 (rozsmarowanie obciążenia GHA)
  workflow_dispatch:

permissions:
  contents: read       # watch nic nie zapisuje do repo

# Watch jest krótki, ale cron co godzinę + opóźnienia GHA (5-60 min) mogą
# nałożyć dwa przebiegi. Debounce broni bazy, ale po co płacić minutami.
concurrency:
  group: shock-watch
  cancel-in-progress: true

jobs:
  watch-market-shock:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # FinOps: twardy limit minut GHA

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🙈 Mask each Alpha Vantage key
        # BEZ-03: GitHub maskuje sekret CSV tylko w całości — pojedynczy klucz z listy
        # wyszedłby w logu jawnie. Maskujemy każdy osobno, zanim ruszy Python.
        env:
          ALPHA_VANTAGE_API_KEYS: ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
        run: scripts/mask-csv-secret.sh ALPHA_VANTAGE_API_KEYS

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: 📦 Sync dependencies
        # Watch NIE dotyka LLM: SDK jest w środowisku, ale nikt tu nie buduje
        # adaptera. Zero płatnych portów.
        run: uv sync --frozen --no-build --no-install-project

      - name: 🚨 Run shock watch (free sources only)
        env:
          # Database — odczyt snapshotów + dedup alertów (migracja 021).
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          # BEZ-08: zapis `shock_alerts` (debounce między przebiegami) wymaga jawnego
          # włączenia — Settings domyślnie nie zapisuje do bazy (lokalny run).
          DB_WRITES_ENABLED: "true"
          # Darmowe źródło ceny dla akcji (krypto idzie po CoinGecko, bez klucza).
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          # Settings wymaga OPENAI_API_KEY jako pola obowiązkowego, choć watch
          # nie woła żadnego LLM. Bez niego konstrukcja Settings rzuca.
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          # Analogicznie: walidator Settings wymaga ≥1 klucza Alpha Vantage.
          # Watch nie woła AV, ale bez tego pola konstrukcja Settings rzuca.
          ALPHA_VANTAGE_API_KEYS: ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          # Kanały push — darmowe. Brak sekretu = kanał po prostu nie powstaje.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          # NIEZ-13: zewnętrzny heartbeat (np. healthchecks.io) — ping na koniec przebiegu,
          # porażka → <URL>/fail. Brak sekretu = pusty string = NullHeartbeat (zero requestów).
          HEARTBEAT_URL:      ${{ secrets.HEARTBEAT_URL }}
        run: uv run --frozen --no-build --no-sync python main_watch.py

      - name: 📮 Mail o porażce jobu
        # NIEZ-23: GitHub mailuje o porażce crona tylko autora ostatniej zmiany crona,
        # a timeout i anulowanie są ciche. Bez Pythona — działa też, gdy padło `uv sync`.
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"
