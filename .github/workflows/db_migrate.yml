name: 🗄️ DB Migrate (manual)

on:
  # WYŁĄCZNIE ręcznie. Migracje NIE wiszą na cronie Fast Loopa: zepsuta migracja
  # odpalałaby się wtedy co dzień, a `022` przebudowuje materialized view
  # `ml_feature_store` (DROP + CREATE). Rejestr `supabase_migrations.schema_migrations`
  # i tak pomija już zaaplikowane, ale ryzyko blokowania dziennego cyklu zostaje.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tylko pokaż, co zostałoby zaaplikowane (nic nie zapisuje)'
        type: boolean
        default: true

permissions:
  contents: read       # nic nie zapisujemy do repo

# Dwa równoległe pushe do tej samej bazy to przepis na zakleszczenie migracji.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # CI-09: konkretna wersja, nie `latest` — binarka wykonuje DDL na produkcji.
          # Przy podbiciu sprawdź parser nazw migracji (`^([0-9]+)_(.*)\.sql$`).
          version: 2.121.0

      - name: 🔍 Dry run — co zostałoby zaaplikowane
        # Zawsze, także przed realnym pushem: log pokazuje listę migracji,
        # zanim cokolwiek dotknie bazy.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: 🚀 Apply migrations
        if: ${{ inputs.dry_run == false }}
        # `--db-url` omija `supabase login` / `link`, więc jedynym sekretem jest
        # connection string. CLI wymusza TLS — połączenie bez szyfrowania odrzuci.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: 📮 Mail o porażce jobu
        # NIEZ-23: GitHub mailuje o porażce crona tylko autora ostatniej zmiany crona,
        # a timeout i anulowanie są ciche. Bez Pythona — działa też, gdy padło `uv sync`.
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"
