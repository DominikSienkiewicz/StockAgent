name: 🗄️ DB Migrate (manual)

on:
  # WYŁĄCZNIE ręcznie. Migracje NIE wiszą na cronie Fast Loopa: zepsuta migracja
  # odpalałaby się wtedy co dzień, a `022` przebudowuje materialized view
  # `ml_feature_store` (DROP + CREATE). Rejestr `supabase_migrations.schema_migrations`
  # i tak pomija już zaaplikowane, ale ryzyko blokowania dziennego cyklu zostaje.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tylko pokaż, co zostałoby zaaplikowane (nic nie zapisuje)'
        type: boolean
        default: true

permissions:
  contents: read       # nic nie zapisujemy do repo

# Dwa równoległe pushe do tej samej bazy to przepis na zakleszczenie migracji.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BEZ-22: jedyny sekret z prawem DDL na produkcji (`SUPABASE_DB_URL`) jest sekretem tego
    # środowiska, nie repo, więc widzi go wyłącznie ten job, a run czeka na zatwierdzenie
    # właściciela (required reviewer) z audytem w UI. Środowiska jeszcze nie ma po stronie
    # GitHuba? Pierwszy run je utworzy bez reguł ochrony, a sekret repo o tej samej nazwie
    # dalej działa — kroki właściciela: docs/running-locally.md (Repository secrets).
    environment: production-db
    # NIEZ-27: jedna kolejka dla wszystkich jobów piszących do bazy (Fast Loop, Slow Loop,
    # DB Migrate), bez anulowania. Na poziomie JOBA, bo grupa workflowu zostaje własna
    # (kolejka runów tego workflowu) i musi mieć inną nazwę, inaczej run czekałby na
    # samego siebie. Shock watch zostaje poza kolejką — pilnuje tego tests/test_workflow_policy.py.
    concurrency:
      group: supabase-writers
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: ⚡ Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # CI-09: konkretna wersja, nie `latest` — binarka wykonuje DDL na produkcji.
          # Przy podbiciu sprawdź parser nazw migracji (`^([0-9]+)_(.*)\.sql$`).
          version: 2.121.0

      - name: 🔍 Dry run — co zostałoby zaaplikowane
        # Zawsze, także przed realnym pushem: log pokazuje listę migracji,
        # zanim cokolwiek dotknie bazy.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: 🚀 Apply migrations
        if: ${{ inputs.dry_run == false }}
        # `--db-url` omija `supabase login` / `link`, więc jedynym sekretem jest
        # connection string. CLI wymusza TLS — połączenie bez szyfrowania odrzuci.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: 📮 Mail o porażce jobu
        # NIEZ-23: GitHub mailuje o porażce crona tylko autora ostatniej zmiany crona,
        # a timeout i anulowanie są ciche. Bez Pythona — działa też, gdy padło `uv sync`.
        if: failure() || cancelled()
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS:      ${{ job.status }}
          WORKFLOW_NAME:   ${{ github.workflow }}
        run: scripts/notify-failure.sh "$WORKFLOW_NAME"
