name: ✅ CI (lint + types + tests)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        # CI-25: jawna wersja uv w KAŻDYM workflowu (inaczej `latest` zależy od dnia runu).
        # Dependabot jej nie podbija — zmieniaj wszędzie naraz, pilnuje tego
        # tests/test_workflow_policy.py. Ta sama wersja jest w docs/running-locally.md.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.22"
          enable-cache: true

      - name: 📦 Sync dependencies (incl. dev + anthropic extra)
        # CI-11: `--locked` pada, gdy uv.lock nie zgadza się z pyproject.toml (zmiana
        # zależności bez `uv lock`); `--frozen` instalowałby po cichu stary lock.
        run: uv sync --locked --extra anthropic --no-build --no-install-project

      - name: 🔍 Ruff (lint)
        run: uv run --frozen --no-build --no-sync ruff check .

      - name: 🎨 Ruff (format)
        # CI-17: repo sformatowane jednym commitem (`.git-blame-ignore-revs`).
        run: uv run --frozen --no-build --no-sync ruff format --check .

      - name: 🔎 Mypy (strict type check)
        # Gołe `mypy` = pliki z `[tool.mypy].files` (src + wszystkie main_*.py
        # + katalogi tests/ dodane ratchetem, od tests/domain).
        # Zgodność z CLAUDE.md / AGENTS.md / docs pilnuje tests/test_quality_gate_sync.py.
        # CI-15: `ignore-without-code` w [tool.mypy] odrzuca goły `# type: ignore`.
        run: uv run --frozen --no-build --no-sync mypy

      - name: 🧪 Pytest (unit tests)
        # Integration tests (-m integration) wymagają prawdziwych kluczy API —
        # pomijane w CI. Testy kontenerowe uruchamiamy jawnie w następnym kroku.
        # Linki względne w Markdown sprawdza tests/test_markdown_links.py (CI-32),
        # więc ta sama bramka łapie martwy link lokalnie.
        # CI-03: pokrycie z gałęziami na src/domain z progiem 98% (zmierzone 2026-10-24:
        # 98,49%). Próg tylko rośnie: ten sam numer w [tool.coverage.report].fail_under
        # w pyproject.toml, a stałą COVERAGE_RATCHET pilnuje tests/test_quality_gate_sync.py.
        # CI-16: raport JUnit dla podsumowania joba (krok „Test counts” niżej).
        run: >-
          uv run --frozen --no-build --no-sync pytest -m "not integration and not containers"
          --cov=src/domain --cov-branch --cov-fail-under=98
          --junitxml=test-results/unit.xml

      - name: 🐳 Pytest (container schema tests)
        # Testy migracji SQL odpalają Postgres + pgvector przez testcontainers.
        env:
          # CI-06: brak demona Dockera = porażka kroku, nie zielony skip zera testów.
          REQUIRE_DOCKER: "1"
        run: uv run --frozen --no-build --no-sync pytest -m containers --junitxml=test-results/containers.xml

      - name: 📊 Test counts (JUnit → job summary)
        # CI-16: tests, skipped i failures liczone z raportów JUnit obu kroków pytest, nie
        # z `def test_` — w commitach linkuj run zamiast przepisywać liczby. Także po
        # czerwonym pytest; krok, który nie ruszył, ma w tabeli wiersz „no report”.
        if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
        run: >-
          uv run --frozen --no-build --no-sync python main_tools.py junit-summary
          test-results/unit.xml test-results/containers.xml >> "$GITHUB_STEP_SUMMARY"

  lint-infra:
    name: Lint workflows and shell scripts
    # CI-23: analiza statyczna workflowów z sekretami i skryptów bash operujących na sekretach
    # repo. Narzędzia z PyPI przez `uvx` w dokładnych wersjach (wydanych ≥ 2 tygodnie przed
    # przypięciem); podbijaj świadomie, ostrzeżenia spłacaj, nie wyciszaj.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.22"

      - name: 🧹 actionlint (workflow syntax + shellcheck of run blocks)
        # `--with shellcheck-py`: actionlint woła shellcheck z PATH, więc bloki `run:`
        # sprawdza ta sama przypięta wersja co skrypty niżej, nie ta z obrazu runnera.
        run: uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint

      - name: 🛡️ zizmor (workflow security audit)
        # Token tylko do odczytu włącza audyty online: commit-podróbka pod przypiętym SHA,
        # znane podatności akcji, komentarz wersji niezgodny z SHA.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 .github/workflows

      - name: 🐚 shellcheck (scripts/)
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reads sonar-project.properties (keys, sources/tests split,
    # sonar.python.coverage.reportPaths → the coverage report produced below).
    # Prerequisites, one-time (see README → GitHub Actions):
    #   1. Add a SONAR_TOKEN repository secret (SonarCloud → My Account → Security).
    #   2. Disable "Automatic Analysis" in SonarCloud (Administration → Analysis
    #      Method) — CI-based and automatic analysis cannot both run on one project,
    #      and only the CI scan uploads the coverage report the gate needs.
    # The scan is skipped until SONAR_TOKEN exists, so this job never blocks CI early.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history → accurate new-code & blame attribution
          persist-credentials: false

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.22"
          enable-cache: true

      - name: 📦 Sync dependencies (incl. dev + anthropic extra)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: uv sync --locked --extra anthropic --no-build --no-install-project

      # Coverage for SonarCloud. Mirrors CI's test selection minus integration (real
      # API keys); container tests use testcontainers (Docker is on the ubuntu runner).
      # Writes coverage.xml at the repo root, where sonar-project.properties expects it.
      # CI-04: `--cov` obejmuje też każdy entry-point (`main_*.py` w sonar.sources).
      - name: 🧪 Pytest with coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        # CI-03: `--cov-fail-under=0` — próg domeny z pyproject.toml nie dotyczy pokrycia
        # całego `src` i entry-pointów; ten job raportuje do Sonara, bramkuje quality.
        run: >-
          uv run --frozen --no-build --no-sync pytest -m "not integration"
          --cov=src --cov=main_agent --cov=main_backtest --cov=main_bot --cov=main_deadman --cov=main_scorecard
          --cov=main_tools --cov=main_trainer --cov=main_watch --cov-report=xml
          --cov-fail-under=0

      - name: 🔍 SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  lowest-direct:
    name: Lowest direct dependencies
    # CI-12: dolne granice z pyproject.toml muszą się dać zainstalować i przejść testy.
    # Tylko z ręcznego uruchomienia CI (Actions → CI → Run workflow): resolver bierze
    # najniższe dozwolone wersje zależności bezpośrednich (także dev) i nadpisuje
    # uv.lock tylko na runnerze. Czerwony job = podnieś dolną granicę w pyproject.toml.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.22"

      - name: 📦 Sync dependencies at their declared lower bounds
        run: uv sync --resolution lowest-direct --extra anthropic --no-build --no-install-project

      - name: 🧪 Pytest (unit tests on the lowest direct dependencies)
        run: uv run --no-sync pytest -m "not integration and not containers"
