# =====================================================
# StockAgent — config NIEWRAŻLIWY (single source of truth)
# =====================================================
# Ten plik jest commitowany i wersjonowany. Czytany wprost przez
# `src/config.py` (pydantic-settings, TomlConfigSettingsSource).
#
# SEKRETY (klucze API, DB credentials, DIGEST_TO_EMAIL) NIE należą tutaj —
# żyją w `.env` (lokalnie) i GitHub Secrets (CI). Patrz `.env.example`.
#
# Precedencja: env var > .env > TEN PLIK > defaulty w kodzie.
# Każdą wartość można nadpisać zmienną środowiskową (np. szybki eksperyment).

# --- LLM ---
# Analiza główna na Anthropic Claude Sonnet 4.6 (warstwa decyzyjna).
# Rada osobno na tanim OpenAI gpt-5-mini — trzyma QuotaMonitor (Anthropic go
# nie wspiera). COUNCIL_LLM_PROVIDER MUSI być 'openai', inaczej rada dziedziczy
# 'anthropic' z modelem OpenAI → crash.
llm_provider = "anthropic"
council_llm_provider = "openai"
council_llm_model = "gpt-5-mini"
# Rada: ważenie person trafnością (#3, RPC z migracji 015) i tryb debaty (#1,
# jedna runda rewizji przy podzielonym round-1). Domyślnie off.
persona_weighting_enabled = false
# WIA-51: wagi i ranking person z surowych głosów (RPC z migracji 045), oceniane
# regułą domeny — HOLD na krypto w paśmie ±2.5% jak predykcja. Część przepisu.
# UWAGA: włącz DOPIERO po migracji 045 (inaczej wagi i ranking są puste).
persona_vote_outcomes_enabled = false
# WIA-44: ranking person w mailu po umiejętności Briera pewności (Brier Skill względem
# stałej prognozy persony) zamiast po samym hit-rate'cie — przepewna persona spada.
# Tylko kolejność i opis w mailu. UWAGA: włącz DOPIERO po migracji 065 (inaczej
# ranking wraca do hit-rate'u z WARNING-iem).
persona_brier_ranking_enabled = false
# WIA-45: redundancja rady z zapisanych głosów (kappa Cohena między personami,
# efektywna liczba niezależnych głosów). Recap tygodniowy dopisuje linię „7 person
# ≈ 2,1 niezależnego głosu”, a mail dzienny nie nadaje „SILNY KONSENSUS”, gdy rada
# mówi w praktyce jednym głosem (N_eff < 1,5 z głosów ostatnich 30 dni). Sama treść
# maili, bez migracji.
council_redundancy_enabled = false
debate_mode_enabled = false
# Model routing (#2): tani model domyślnie, eskalacja do frontier gdy
# confidence < routing_floor. Domyślnie off (główna analiza wg llm_provider).
model_routing_enabled = false
routing_floor = 0.6
# NIEZ-17: sufit eskalacji do frontiera na cykl; awaria frontiera zwraca wynik taniego.
routing_max_escalations = 5
router_cheap_model = "gpt-5-mini"
router_frontier_provider = "anthropic"
router_frontier_model = "claude-sonnet-4-6"
# NIEZ-44: zapasowy dostawca analizy głównej — request idzie do niego tylko, gdy główny
# padnie po swoich retry (błąd 4xx inny niż 429 nie przełącza). Predykcja od zapasowego
# dostaje flagę jakości `llm_failover` i faktyczny model w kwicie (osobna wersja
# przepisu). Wymaga klucza drugiego dostawcy w sekretach. Wyłączony — odkomentuj:
# llm_fallback_provider = "openai"
# llm_fallback_model = "gpt-4o"
# Reżim rynku (#7): RISK-OFF zacieśnia próg volatility (mnożnik ≤ max). Włączone.
regime_aware_enabled = true
regime_threshold_max_multiplier = 2.0
# ML-38: `regime_tagging_enabled` (tag reżimu w prediction_logs.regime przy każdej
# predykcji, migracja 017) celowo NIEUSTAWIONE — dziedziczy regime_aware_enabled.
# `false` wyłącza sam tag (np. deployment bez migracji 017 → inaczej PGRST204).
# ALR-03: histereza reżimu — wejście w RISK-OFF od razu, wyjście po N kolejnych
# surowych odczytach (N = przebiegi Fast Loopa, przy ręcznych dispatchach nie dni).
# Stan w tabeli `regime_history`. UWAGA: włącz DOPIERO po migracji 033.
regime_hysteresis_enabled = true
regime_exit_confirmations = 2
# Contagion (#5): werdykty spółek z tego samego sektora z tego cyklu do promptu.
# Grupy (`peer_groups`) idą z `sectors` niżej. Off.
contagion_enabled = false
# Kalibracja pewności sędzią-LLM (#4, Slow Loop, migracja 016). Off.
calibration_judge_enabled = false
# Sędzia zapisuje regułę Briera 1 − (c − o)² z wersją v2 (WIA-37). Włącz DOPIERO
# po migracji 044 (PGRST204). Off: reguła liniowa v1, bez kolumny wersji.
calibration_score_version_enabled = false
# NIEZ-25: Slow Loop pyta Models API (bez tokenów), czy skonfigurowane modele żyją.
model_probe_enabled = true

# WIA-53: spłata długu diagnoz — Slow Loop diagnozuje błędne predykcje, którym bramka
# volatility pominęła płatną diagnozę, najwyżej `diagnosis_backfill_max_calls` LLM na
# przebieg, w budżecie `slow_loop_max_paid_llm_calls_per_week` (po recapie i sędzi).
# Przepisany wniosek trafia do lessons i analogów RAG. Off.
diagnosis_backfill_enabled = false
diagnosis_backfill_max_calls = 5
# Tool-use research agent (#6): na największych ruchach model dociąga read-only
# toole (fundamenty/makro) przed werdyktem. Płatna, wielorundowa ścieżka — off.
tool_use_enabled = false
tool_use_max_rounds = 3
# Risk: VaR/CVaR + stress-test (rozszerzenia PortfolioRisk) i hedge-effectiveness
# (rozszerzenie Risk Watch). Wszystkie z darmowych snapshotów, render-only. Off.
portfolio_var_enabled = false
var_confidence = 0.95
stress_test_enabled = false
hedge_effectiveness_enabled = false
# Trust / track-record (render-only, zero płatnych): krzywa kapitału (paper-PnL),
# krzywa kalibracji (reliability), panel „lessons learned". Włączone.
equity_curve_enabled = true
calibration_curve_enabled = true
lessons_enabled = true
# #9: pewność LLM korygowana historycznym hit-rate'em swojego kubełka kalibracji
# — przestawia ranking „🎯 Najsilniejsze sygnały". Render-only, zero zapisu. Włączone.
calibrated_confidence_enabled = true
# #5: push (Telegram/Slack) dostaje 5-linijkowy skrót zamiast pełnego raportu —
# pełny plain-text przekracza limit 4096 znaków Telegrama (400, cichy zgon). Włączone.
messenger_digest_enabled = true
# #12: karta kondycji modelu (migracja 019) — jawny scorecard walk-forward wraz
# z odrzutami kandydatów. Zapis w Slow Loopie, render w mailu. Włączone.
model_scorecard_enabled = true
# ML-10: karta zapisuje też baseline'y „dryf średniej" i „sam LLM" (bramka bije
# najsilniejszy z trzech). UWAGA: włącz DOPIERO po migracji 028 (inaczej PGRST204).
model_scorecard_baselines_enabled = true
# ML-24: wiersze karty niosą `run_id` przebiegu Slow Loopa (re-run tego samego
# dnia nie skleja się z cronem). UWAGA: włącz DOPIERO po migracji 049 (PGRST204).
model_scorecard_run_id_enabled = false
# ML-21: karta zapisuje rozkład cech treningu (biny kwantylowe + PSI ostatnich 30 dni)
# i ostrzega przy PSI > 0.25. UWAGA: włącz DOPIERO po migracji 052 (PGRST204).
model_scorecard_feature_stats_enabled = false
# #8: sekcja „🔄 Zmiany nastawienia" — flip rady BUY→SELL, skok sentymentu,
# spadek konsensusu vs poprzedni cykl. Odczyt z Supabase, zero płatnych. Włączone.
cycle_diff_enabled = true
# #13: kwity decyzyjne (migracja 020) — persystowany audit trail predykcji.
# UWAGA: włącz DOPIERO po zaaplikowaniu migracji 020, inaczej PGRST204. Włączone.
receipts_enabled = true
# DAT-09: wersja zestawu cech (migracja 027) — `news_volume_24h` zmieniło znaczenie
# (okno 24 h, 3738ef2). Stempel na predykcji i filtr treningu po bieżącej wersji.
# UWAGA: włącz DOPIERO po zaaplikowaniu migracji 027 (inaczej PGRST204 / 400).
# Filtr odcina historię: póki wierszy bieżącej wersji jest mniej niż minimum
# treningu, Slow Loop jawnie pomija model wspólny (status skipped + n_samples).
# ML-51: filtr obejmuje też main_backtest. Włącz go dopiero przy >= 75 wierszach
# bieżącej wersji w widoku (minimum bramki walk-forward przy 4 foldach).
feature_set_version_enabled = true
feature_set_filter_enabled = true
# WIA-20: kolumna `recipe_version` (migracja 030) — wersja przepisu predykcji
# (modele, szablon promptu, persony, config, wagi ML). Pola przepisu w kwicie v2
# idą już z `receipts_enabled`. UWAGA: włącz DOPIERO po migracji 030 (PGRST204).
recipe_version_enabled = true
# ML-14: wektor cech point-in-time w KAŻDYM cyklu, także ignored (tabela
# `feature_snapshots`, migracja 031) — cechy darmowe ze stanu cyklu zawsze, cechy
# LLM tylko za bramką, zero nowych wywołań. UWAGA: włącz DOPIERO po migracji 031.
feature_snapshots_enabled = true
# ML-31: cechy rynkowe cyklu w `feature_snapshots` (zmienność i momentum z darmowych
# snapshotów cen) + wersja zestawu cech 4 w stemplach (filtr treningu też po 4).
# Działa tylko z feature_snapshots_enabled; bez nowej migracji, zero płatnych wywołań.
# Włączone 2026-10-25 decyzją właściciela: wektory v4 zbierają się pod ML-52.
market_features_enabled = true
# ML-52: model wspólny (wagi serwowane przez Fast Loop) z wektorów feature_snapshots
# wersji 4 (cykle gated, wektor z servingu, etykieta 12 h z price_snapshots) zamiast
# z widoku ml_feature_store. Bez nowej migracji (031 jest na produkcji), ale wymaga
# wektorów wersji 4: włącz DOPIERO po market_features_enabled i zebraniu >= 75
# oznaczonych cykli gated (karta ALL_LLM w summary Slow Loopa pokazuje ich liczbę).
snapshot_training_enabled = false
# ML-11: target modelu wspólnego = zwrot / σ (σ zwrotów symbolu z 20 poprzednich
# cykli, z podłogą 0,25%), karty i baseline'y w jednostkach σ; Fast Loop mnoży
# prognozę takiego modelu przez σ (jedna funkcja domenowa w obu pętlach). Bez
# migracji. Zmienia przepis serwowania prognozy — włącz świadomie (po EXP-02/03).
ml_sigma_target_enabled = false
# ML-34: przedział 80% ruchu (conformal + ACI) jest w mailu zawsze — liczony w cyklu
# z rozliczonych predykcji, bez migracji. Flaga dokłada zapis `interval_low/high`
# i pokrycie zrealizowane vs nominalne w Track Record. UWAGA: włącz DOPIERO po
# migracji 032 (inaczej PGRST204 i przepadły zapis predykcji).
interval_coverage_enabled = true
# EXP-01: delta ceny, która otworzyła bramkę volatility, w `prediction_logs.gate_delta`
# — test echa momentum w `uv run python main_tools.py evaluate --echo` (offline, nie
# w mailu). Historia z backfillu migracji. UWAGA: włącz DOPIERO po migracji 034 (PGRST204).
gate_delta_enabled = true
# EXP-05: eksperymenty w pętli (definicje `experiments.<id>.*` na końcu pliku) —
# ramię per symbol-dzień UTC = sha256(id|symbol|dzień) mod liczba ramion. Ramię
# idzie do kwitu v2 (za receipts_enabled, bez migracji); ta flaga dokłada kolumnę
# `prediction_logs.experiment_arms`. UWAGA: włącz DOPIERO po migracji 037 (PGRST204).
experiment_arms_enabled = true
# ML-29: prompt prosi o rozkład P(BULLISH/BEARISH/SIDEWAYS) (+~20 tokenów wyjścia, zero
# nowych wywołań); trend = argmax, pewność = max p, rozkład w `trend_probabilities`.
# Zmienia prompt → nowy przepis. UWAGA: włącz DOPIERO po migracji 051 (PGRST204).
trend_probabilities_enabled = false
# BEZ-14: lekcja z reflect (prompt predykcji) i uzasadnienia person (prompt
# przewodniczącego) w fence'u DATA-ONLY — piszemy je LLM-em z newsów stron trzecich, więc
# mogą nieść przechowany prompt-injection. Zmienia tekst promptów (nowy przepis), więc
# czeka do końca EXP-02/03. Bez migracji. Off.
prompt_taint_fence_enabled = false
# WIA-19: okna „zamknięte predykcje” po chwili rozliczenia (`settled_at`, migracja
# 029): sekcja maila = rozliczone w tym cyklu, recap = rozliczone w ostatnich 7 dniach.
# UWAGA: włącz DOPIERO po zaaplikowaniu migracji 029 (inaczej 400 i sekcja znika).
settled_at_windows_enabled = true
# #11: darmowy watch szoku rynkowego poza cyklem (main_watch.py, migracja 021).
# Zero płatnych API — tylko Finnhub/CoinGecko + Supabase. Cron co godzinę
# (shock_watch_hourly.yml) wznowiony 2026-10-23; bez kanału push (TELEGRAM_* albo
# SLACK_WEBHOOK_URL) watch loguje błąd i niczego nie wysyła.
shock_alerts_enabled = true
# ALR-07: szok portfela — watch liczy Σ waga × Δ po pozycjach z tabeli `positions` i przy
# |Δ| ≥ progu wysyła jeden push dziennie („💼 Portfel -3,4% (NVDA -6,0%, AMD -5,0%)”).
# Łapie skoordynowany spadek wielu spółek, którego progi per symbol (2× bramki) nie
# widzą. Debounce w `shock_alerts` pod symbolem „__PORTFOLIO__” (nowy zapis, bez
# migracji). Wymaga `portfolio_positions_enabled` i kanału push. Domyślnie wyłączone.
portfolio_shock_enabled = false
portfolio_shock_threshold = 0.03
# ALR-09: cisza nocna pushy watcha (czas `display_timezone`) — w oknie 22:00–07:00
# szok dociera bez dźwięku zamiast budzić. Alerty CRITICAL ciszy nie znają. Włączone.
quiet_hours_enabled = true
quiet_hours_start = "22:00"
quiet_hours_end = "07:00"
# ALR-11: alerty poziomów cenowych w watchu („daj znać, gdy NVDA przebije 150”): push
# przy PRZEKROCZENIU poziomu między dwoma przebiegami watcha, alert wyłącza się po
# trafieniu. Zero płatnych API, watch nie zapisuje `price_snapshots` — poprzedni odczyt
# żyje przy alercie. UWAGA: włącz DOPIERO po migracji 057.
price_level_alerts_enabled = false
# Lista startowa — watch dopisuje brakujące poziomy do tabeli `price_level_alerts`
# (zapisanych, także wyłączonych po trafieniu, nie rusza). Przykład wpisu:
#   { symbol = "NVDA", level = 150, direction = "ABOVE", note = "realizacja części zysku" }
price_alerts = []
# NIEZ-11: deadman (main_deadman.py, cron raz dziennie, zero płatnych API) mailuje
# przez Resend, gdy job zamilkł dłużej niż przerwa w godzinach. 0 = job świadomie
# wstrzymany. Slow Loop chodzi co niedzielę — 192 h to tydzień plus dzień zapasu na
# opóźnienia crona GitHuba. Fast Loop liczy się w dniach handlowych NYSE: przerwa to
# zapas od północy ET każdego dnia handlowego (weekend i święto nie alarmują) —
# 26 = alarm po dwóch dniach handlowych bez cyklu (cron wznowiony 2026-10-23).
liveness_fast_loop_max_gap_h = 26
liveness_slow_loop_max_gap_h = 192
# #14: Alpha Fusion Score (migracja 022) — ważona fuzja insider/opcje/analitycy/
# social/earnings. Trafia do promptu LLM i do ml_feature_store jako KANDYDAT na cechę ML —
# model go nie używa (nie ma go w ML_FEATURE_COLUMNS); promocja po porównaniu A/B (EXP-19). Włączone.
alpha_fusion_enabled = true
# #16: commit-reveal (migracja 024) — kryptograficznie weryfikowalny track record.
# Claim: tamper-evidence przy branch protection, NIE niepodrabialny timestamp.
# Wyłączone do czasu utworzenia i ochrony gałęzi `attestation-log`: Fast Loop
# checkoutuje ją do `public/attestation/`, a job `publish-attestation-ledger` pushuje
# tam nowe linie (WIA-14). UWAGA: włącz DOPIERO po migracjach 024 i 043 (inaczej
# PGRST204) i po kroku 9 z docs/resume-checklist.md (flaga on bez gałęzi wywala cykl).
attestation_enabled = false
# #15: realny portfel użytkownika (tabela `positions`, migracja 023) — wagi,
# P/L i VaR w PLN zamiast fikcji równych wag. Flaga off → Null adapter. Włączone.
portfolio_positions_enabled = true
# PORT-18: waluta i prawdziwa data zakupu pozycji (`positions.currency`,
# `purchase_date`, migracja 035) — odczyt w raporcie i zapis importu CSV
# (`main_tools.py import-positions`). UWAGA: włącz DOPIERO po migracji 035
# (inaczej PGRST204 przy imporcie).
positions_currency_enabled = true
# PORT-11: P/L w zł po kursie NBP z dnia zakupu — kursy z NBP (darmowe) idą za
# `nbp_enabled`; ta flaga dokłada tylko cache kursów z minionych dni w tabeli
# `fx_rates`. UWAGA: włącz DOPIERO po migracji 036 (inaczej błędy w logu).
fx_rates_cache_enabled = true
# #17: niedzielna retrospektywa („Tydzień StockAgenta"). Koszt: 1 wywołanie LLM
# TYGODNIOWO. Poniżej 5 zamkniętych predykcji mail nie wychodzi. Włączone.
weekly_recap_enabled = true
# #10: publiczny scorecard kalibracji — wyłącznie agregaty (N, hit-rate, ECE),
# zero PII i zero symboli; prywatny mail tam nie trafia (MAIL-24). Wyłączone do
# ustawienia Pages (Source: GitHub Actions); deploy: scorecard_pages.yml (WIA-52)
# i job deploy-scorecard Fast Loopa (WIA-16), kolejność: docs/resume-checklist.md.
public_scorecard_enabled = false
public_scorecard_path = "public/scorecard/index.html"
# NIEZ-33: publiczna strona statusu z `cycle_runs` (czy Fast Loop działa, kiedy ostatnio
# wyszedł digest, płatne wywołania 7/30 dni) i JSON odznaki „last digest” obok niej. Leży
# w katalogu scorecardu, więc wychodzi tym samym deployem Pages — potrzebuje też
# `public_scorecard_enabled`. Same agregaty, zero płatnych wywołań. UWAGA: włącz DOPIERO
# po migracji 041 (z `cycle_runs_enabled`) i po kroku 9 z docs/resume-checklist.md.
public_status_page_enabled = false
public_status_path = "public/scorecard/status/index.html"
attestation_commitments_path = "public/attestation/commitments.jsonl"
attestation_reveals_path = "public/attestation/reveals.jsonl"
track_record_days = 30
# WIA-50: jednostronny koszt transakcyjny paper-PnL i backtestu (bps od obrotu),
# naliczany tylko przy zmianie pozycji symbolu (wejście/wyjście 1×, odwrócenie 2×).
paper_cost_bps = 10
crypto_paper_cost_bps = 25
# Dane — nowe źródła alpha. Default off → Null adapter (zero płatnych). Realny
# adapter włącza flaga (+ ewentualny klucz: FRED_API_KEY dla yield_curve).
# insider_flow: od co najmniej 2026-07-27 sec.gov odpowiada 403 na PIERWSZE żądanie
# każdego cyklu (także spod domowego IP), mimo User-Agenta z kontaktem — trwała
# blokada, nie 10-minutowy limit tempa. Adapter przestrzega już fair access SEC
# (~8 req/s, mapa tickerów raz na cykl, cisza po 403), ale blokadę zdejmuje tylko
# SEC. Off, dopóki SEC (webmaster@sec.gov, z Reference ID ze strony 403) jej nie
# zdejmie; potem true i jeden ręczny run. Szczegóły: docs/configuration.md.
insider_flow_enabled = false
# earnings_calendar: +1 wywołanie Alpha Vantage na symbol (~39/dzień) NA DODATEK do
# sentymentu (~39/dzień). Darmowy AV = 25 req/dzień/klucz, więc wymaga >= 4 kluczy.
# Włącz dopiero, gdy masz tyle w ALPHA_VANTAGE_API_KEYS. Odblokowuje bramkę earnings (#6).
earnings_calendar_enabled = false
# FIN-11 (wymaga migracji 053): z kalendarzem bramka earnings czyta datę raportu
# z `earnings_cache`, który Slow Loop odświeża raz w tygodniu wszystkimi kluczami AV —
# Fast Loop nie płaci wtedy za kalendarz. Off, dopóki DB Migrate nie założy tabeli.
earnings_cache_enabled = false
# FIN-32: najgorszy przypadek doby AV (cała watchlista za bramką, +1 na symbol przy
# kalendarzu wyników) ponad 25 × liczba kluczy → WARNING w logu i w bannerze maila.
# true = błąd startu zamiast ostrzeżenia. Off, bo liczba kluczy żyje w sekretach.
av_budget_strict = false
# FIN-32: cykle Fast Loopa na dobę w tym budżecie = uruchomienia na dobę z harmonogramu
# `.github/workflows/fast_loop_12h.yml` (cron '30 5 * * 1-5' → 1). Test strażnik pilnuje
# zgodności — zmieniasz cron, zmień i to.
fast_loop_cycles_per_day = 1
# FIN-12: sufit płatnych wywołań LLM jednego cyklu Fast Loopa (predykcja, diagnoza
# pomyłki, każdy request rady). Miękki: symbol za bramką wchodzi, dopóki wydane < sufit;
# kolejne idą do „Pominięte — wyczerpany budżet cyklu” bez snapshotu ceny.
max_paid_llm_calls_per_cycle = 100
# WIA-11: jawny budżet tygodniowy Fast Loopa (USD, szacunek UNIT_COST_USD). Najgorszy
# tydzień = cała watchlista za bramką przy suficie wyżej (rada ≤ 99 + 4 symbole w locie
# × 8 requestów) × fast_loop_cycles_per_day × 5 dni handlowych; ponad budżet → WARNING
# i alert w bannerze maila przy starcie. Dla tego pliku (2026-10-20): 1,2112 USD na cykl,
# 6,06 USD na tydzień, zaokrąglone w górę do pełnego dolara. Zmieniasz watchlistę, sufit,
# radę albo cron — przelicz (`main_tools.py cost-envelope`, wiersz tygodniowy); start
# Fast Loopa ostrzeże, gdy budżet przestanie wystarczać.
fast_loop_weekly_budget_usd = 7.0
