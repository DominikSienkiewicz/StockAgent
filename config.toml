# =====================================================
# StockAgent — config NIEWRAŻLIWY (single source of truth)
# =====================================================
# Ten plik jest commitowany i wersjonowany. Czytany wprost przez
# `src/config.py` (pydantic-settings, TomlConfigSettingsSource).
#
# SEKRETY (klucze API, DB credentials, DIGEST_TO_EMAIL) NIE należą tutaj —
# żyją w `.env` (lokalnie) i GitHub Secrets (CI). Patrz `.env.example`.
#
# Precedencja: env var > .env > TEN PLIK > defaulty w kodzie.
# Każdą wartość można nadpisać zmienną środowiskową (np. szybki eksperyment).

# --- LLM ---
# Analiza główna na Anthropic Claude Sonnet 4.6 (warstwa decyzyjna).
# Rada osobno na tanim OpenAI gpt-5-mini — trzyma QuotaMonitor (Anthropic go
# nie wspiera). COUNCIL_LLM_PROVIDER MUSI być 'openai', inaczej rada dziedziczy
# 'anthropic' z modelem OpenAI → crash.
llm_provider = "anthropic"
council_llm_provider = "openai"
council_llm_model = "gpt-5-mini"
# Rada: ważenie person trafnością (#3, RPC z migracji 015) i tryb debaty (#1,
# jedna runda rewizji przy podzielonym round-1). Domyślnie off.
persona_weighting_enabled = false
debate_mode_enabled = false
# Model routing (#2): tani model domyślnie, eskalacja do frontier gdy
# confidence < routing_floor. Domyślnie off (główna analiza wg llm_provider).
model_routing_enabled = false
routing_floor = 0.6
router_cheap_model = "gpt-5-mini"
router_frontier_provider = "anthropic"
router_frontier_model = "claude-sonnet-4-6"
# Reżim rynku (#7): RISK-OFF zacieśnia próg volatility (mnożnik ≤ max). Włączone.
regime_aware_enabled = true
regime_threshold_max_multiplier = 2.0
# ML-38: `regime_tagging_enabled` (tag reżimu w prediction_logs.regime przy każdej
# predykcji, migracja 017) celowo NIEUSTAWIONE — dziedziczy regime_aware_enabled.
# `false` wyłącza sam tag (np. deployment bez migracji 017 → inaczej PGRST204).
# ALR-03: histereza reżimu — wejście w RISK-OFF od razu, wyjście po N kolejnych
# surowych odczytach (N = przebiegi Fast Loopa, przy ręcznych dispatchach nie dni).
# Stan w tabeli `regime_history`. UWAGA: włącz DOPIERO po migracji 033.
regime_hysteresis_enabled = false
regime_exit_confirmations = 2
# Contagion (#5): werdykty spółek z tego samego sektora z tego cyklu do promptu.
# Grupy (`peer_groups`) idą z `sectors` niżej. Off.
contagion_enabled = false
# Kalibracja pewności sędzią-LLM (#4, Slow Loop, migracja 016). Off.
calibration_judge_enabled = false
# Tool-use research agent (#6): na największych ruchach model dociąga read-only
# toole (fundamenty/makro) przed werdyktem. Płatna, wielorundowa ścieżka — off.
tool_use_enabled = false
tool_use_max_rounds = 3
# Risk: VaR/CVaR + stress-test (rozszerzenia PortfolioRisk) i hedge-effectiveness
# (rozszerzenie Risk Watch). Wszystkie z darmowych snapshotów, render-only. Off.
portfolio_var_enabled = false
var_confidence = 0.95
stress_test_enabled = false
hedge_effectiveness_enabled = false
# Trust / track-record (render-only, zero płatnych): krzywa kapitału (paper-PnL),
# krzywa kalibracji (reliability), panel „lessons learned". Włączone.
equity_curve_enabled = true
calibration_curve_enabled = true
lessons_enabled = true
# #9: pewność LLM korygowana historycznym hit-rate'em swojego kubełka kalibracji
# — przestawia ranking „🎯 Najsilniejsze sygnały". Render-only, zero zapisu. Włączone.
calibrated_confidence_enabled = true
# #5: push (Telegram/Slack) dostaje 5-linijkowy skrót zamiast pełnego raportu —
# pełny plain-text przekracza limit 4096 znaków Telegrama (400, cichy zgon). Włączone.
messenger_digest_enabled = true
# #12: karta kondycji modelu (migracja 019) — jawny scorecard walk-forward wraz
# z odrzutami kandydatów. Zapis w Slow Loopie, render w mailu. Włączone.
model_scorecard_enabled = true
# ML-10: karta zapisuje też baseline'y „dryf średniej" i „sam LLM" (bramka bije
# najsilniejszy z trzech). UWAGA: włącz DOPIERO po migracji 028 (inaczej PGRST204).
model_scorecard_baselines_enabled = false
# #8: sekcja „🔄 Zmiany nastawienia" — flip rady BUY→SELL, skok sentymentu,
# spadek konsensusu vs poprzedni cykl. Odczyt z Supabase, zero płatnych. Włączone.
cycle_diff_enabled = true
# #13: kwity decyzyjne (migracja 020) — persystowany audit trail predykcji.
# UWAGA: włącz DOPIERO po zaaplikowaniu migracji 020, inaczej PGRST204. Włączone.
receipts_enabled = true
# DAT-09: wersja zestawu cech (migracja 027) — `news_volume_24h` zmieniło znaczenie
# (okno 24 h, 3738ef2). Stempel na predykcji i filtr treningu po bieżącej wersji.
# UWAGA: włącz DOPIERO po zaaplikowaniu migracji 027 (inaczej PGRST204 / 400).
# Filtr odcina historię: póki wierszy bieżącej wersji jest mniej niż minimum
# treningu, Slow Loop jawnie pomija model wspólny (status skipped + n_samples).
feature_set_version_enabled = false
feature_set_filter_enabled = false
# WIA-20: kolumna `recipe_version` (migracja 030) — wersja przepisu predykcji
# (modele, szablon promptu, persony, config, wagi ML). Pola przepisu w kwicie v2
# idą już z `receipts_enabled`. UWAGA: włącz DOPIERO po migracji 030 (PGRST204).
recipe_version_enabled = false
# ML-14: wektor cech point-in-time w KAŻDYM cyklu, także ignored (tabela
# `feature_snapshots`, migracja 031) — cechy darmowe ze stanu cyklu zawsze, cechy
# LLM tylko za bramką, zero nowych wywołań. UWAGA: włącz DOPIERO po migracji 031.
feature_snapshots_enabled = false
# ML-34: przedział 80% ruchu (conformal + ACI) jest w mailu zawsze — liczony w cyklu
# z rozliczonych predykcji, bez migracji. Flaga dokłada zapis `interval_low/high`
# i pokrycie zrealizowane vs nominalne w Track Record. UWAGA: włącz DOPIERO po
# migracji 032 (inaczej PGRST204 i przepadły zapis predykcji).
interval_coverage_enabled = false
# EXP-01: delta ceny, która otworzyła bramkę volatility, w `prediction_logs.gate_delta`
# — test echa momentum w `uv run python main_tools.py evaluate --echo` (offline, nie
# w mailu). Historia z backfillu migracji. UWAGA: włącz DOPIERO po migracji 034 (PGRST204).
gate_delta_enabled = false
# EXP-05: eksperymenty w pętli (definicje `experiments.<id>.*` na końcu pliku) —
# ramię per symbol-dzień UTC = sha256(id|symbol|dzień) mod liczba ramion. Ramię
# idzie do kwitu v2 (za receipts_enabled, bez migracji); ta flaga dokłada kolumnę
# `prediction_logs.experiment_arms`. UWAGA: włącz DOPIERO po migracji 037 (PGRST204).
experiment_arms_enabled = false
# WIA-19: okna „zamknięte predykcje” po chwili rozliczenia (`settled_at`, migracja
# 029): sekcja maila = rozliczone w tym cyklu, recap = rozliczone w ostatnich 7 dniach.
# UWAGA: włącz DOPIERO po zaaplikowaniu migracji 029 (inaczej 400 i sekcja znika).
settled_at_windows_enabled = false
# #11: darmowy watch szoku rynkowego poza cyklem (main_watch.py, migracja 021).
# Zero płatnych API — tylko Finnhub/CoinGecko + Supabase. Włączone, ale cron
# co godzinę jest wstrzymany razem z Fast Loopem (jedyne źródło referencji cen),
# więc watch rusza wyłącznie z ręcznego dispatchu.
shock_alerts_enabled = true
# NIEZ-11: deadman (main_deadman.py, cron raz dziennie, zero płatnych API) mailuje
# przez Resend, gdy job zamilkł dłużej niż przerwa w godzinach. 0 = job świadomie
# wstrzymany: Fast Loop stoi (decyzja 2). Slow Loop chodzi co niedzielę — 192 h to
# tydzień plus dzień zapasu na opóźnienia crona GitHuba. Fast Loop liczy się w dniach
# handlowych NYSE: przerwa to zapas od północy ET każdego dnia handlowego (weekend
# i święto nie alarmują) — przy wznowieniu np. 26 (alarm po dwóch dniach bez cyklu).
liveness_fast_loop_max_gap_h = 0
liveness_slow_loop_max_gap_h = 192
# #14: Alpha Fusion Score (migracja 022) — ważona fuzja insider/opcje/analitycy/
# social/earnings. Trafia do promptu LLM i jako ósma cecha ML. Włączone.
alpha_fusion_enabled = true
# #16: commit-reveal (migracja 024) — kryptograficznie weryfikowalny track record.
# Claim: tamper-evidence przy branch protection, NIE niepodrabialny timestamp.
# Wyłączone: żaden workflow nie publikuje `public/attestation/` (brak kroku
# deploy/push), więc commitmenty lądowałyby tylko na efemerycznym dysku runnera.
# Włącz razem z krokiem publikacji i DOPIERO po migracji 024 (inaczej PGRST204).
attestation_enabled = false
# #15: realny portfel użytkownika (tabela `positions`, migracja 023) — wagi,
# P/L i VaR w PLN zamiast fikcji równych wag. Flaga off → Null adapter. Włączone.
portfolio_positions_enabled = true
# PORT-18: waluta i prawdziwa data zakupu pozycji (`positions.currency`,
# `purchase_date`, migracja 035) — odczyt w raporcie i zapis importu CSV
# (`main_tools.py import-positions`). UWAGA: włącz DOPIERO po migracji 035
# (inaczej PGRST204 przy imporcie).
positions_currency_enabled = false
# PORT-11: P/L w zł po kursie NBP z dnia zakupu — kursy z NBP (darmowe) idą za
# `nbp_enabled`; ta flaga dokłada tylko cache kursów z minionych dni w tabeli
# `fx_rates`. UWAGA: włącz DOPIERO po migracji 036 (inaczej błędy w logu).
fx_rates_cache_enabled = false
# #17: niedzielna retrospektywa („Tydzień StockAgenta"). Koszt: 1 wywołanie LLM
# TYGODNIOWO. Poniżej 5 zamkniętych predykcji mail nie wychodzi. Włączone.
weekly_recap_enabled = true
# #10: publiczny scorecard kalibracji — wyłącznie agregaty (N, hit-rate, ECE),
# zero PII i zero symboli. Osobna ścieżka niż prywatny web_digest. Wyłączone:
# workflow nie ma kroku publikacji (Pages), a strażnik w
# tests/test_workflow_env_wiring.py nie przepuści flagi bez niego.
public_scorecard_enabled = false
public_scorecard_path = "public/scorecard/index.html"
attestation_commitments_path = "public/attestation/commitments.jsonl"
attestation_reveals_path = "public/attestation/reveals.jsonl"
track_record_days = 30
# WIA-50: jednostronny koszt transakcyjny paper-PnL i backtestu (bps od obrotu),
# naliczany tylko przy zmianie pozycji symbolu (wejście/wyjście 1×, odwrócenie 2×).
paper_cost_bps = 10
crypto_paper_cost_bps = 25
# Dane — nowe źródła alpha. Default off → Null adapter (zero płatnych). Realny
# adapter włącza flaga (+ ewentualny klucz: FRED_API_KEY dla yield_curve).
insider_flow_enabled = true
# earnings_calendar: +1 wywołanie Alpha Vantage na symbol (~39/dzień) NA DODATEK do
# sentymentu (~39/dzień). Darmowy AV = 25 req/dzień/klucz, więc wymaga >= 4 kluczy.
# Włącz dopiero, gdy masz tyle w ALPHA_VANTAGE_API_KEYS. Odblokowuje bramkę earnings (#6).
earnings_calendar_enabled = false
# options_flow: option-chain to endpoint PREMIUM Finnhuba — na free tier zwraca 403,
# więc sygnał nie powstaje, a każdy cykl marnuje ~39 requestów. Off do czasu planu premium.
# Odblokowuje #18 (edge vs implied move).
options_flow_enabled = false
social_velocity_enabled = true
yield_curve_enabled = true
analyst_consensus_enabled = true
vector_memory_enabled = false
# Trafia dosłownie do nagłówka `User-Agent` requestów do sec.gov (EdgarInsiderAdapter)
# oraz reddit.com (RedditSocialAdapter). Polityka SEC wymaga REALNEGO kontaktu, żeby
# mogli napisać, gdy ruch automatyczny zacznie im przeszkadzać — placeholder kończy
# się 403 albo blokadą IP.
#
# UWAGA: ten plik jest commitowany do publicznego repo, więc adres jest jawny i trafia
# do historii gita na stałe. Dlatego stoi tu ALIAS, nie prywatna skrzynka — jest zbywalny,
# a SEC i tak potrzebuje wyłącznie działającego kanału kontaktu. Gdyby kiedyś trzeba było
# go ukryć: zostawić tu placeholder i nadpisać zmienną `EDGAR_USER_AGENT`
# (precedencja env > .env > config.toml), tak jak repo traktuje `DIGEST_TO_EMAIL`.
edgar_user_agent = "StockAgent/1.0 (github.shelf261@passmail.net)"
council_personas_dir = "data/council_personas"

# --- Bramki volatility (Decimal jako string — dokładność) ---
volatility_threshold = "0.02"
council_volatility_threshold = "0.03"
crypto_volatility_threshold = "0.05"
# Osobny, wyższy próg dla pętli tool-use (#6) — tylko duże ruchy ją uruchamiają.
tool_use_volatility_threshold = "0.05"

# --- Pętla / resilience ---
symbol_throttle_seconds = 2.0
# Symbole przetwarzane równolegle w Fast Loop. Każdy symbol i tak rozwija radę
# do ~7 callsów OpenAI naraz, więc realny fan-out ~N×7. Przy 429 (rate-limit)
# obniż tę wartość. 1 = sekwencyjnie. Throttle/contagion działają tylko przy 1.
symbol_concurrency = 4
ml_model_path = "data/models/price_predictor.ubj"
# Minimalny wiek predykcji (h), zanim reflect ją oceni. Kadencja dzienna →
# 6h bezpiecznie odsiewa przedwczesną ocenę przy nakładających się cyklach.
reflection_min_age_hours = 6
# Maksymalny wiek predykcji (h), którą reflect jeszcze rozlicza (WIA-04). Starsze
# (np. po przerwie w cronie) zostają nierozliczone, zamiast oceny bieżącą ceną.
# 96h obejmuje weekend z zapasem. 0 = bez granicy.
reflection_max_age_hours = 96
# Outcome-aware RAG rerank (#9): waga realnego wyniku analogu (trafiony przed
# nietrafionym przy zbliżonym similarity). 0.0 = sama kolejność similarity.
rag_outcome_weight = 0.3

# --- Powiadomienia (sam nadawca; ODBIORCA = sekret w .env) ---
notifications_enabled = true
digest_from_email = "onboarding@resend.dev"
# MAIL-14: godziny w temacie i nagłówku maila, pushu i alercie szoku — w tej
# strefie (nazwa IANA, z czasem letnim). Logi zostają w UTC.
display_timezone = "Europe/Warsaw"
# Real-time alerty CRITICAL na kanały push (Telegram/Slack) w chwili zdarzenia,
# out-of-band od dziennego maila. Sekrety kanałów (TELEGRAM_*, SLACK_*) w .env.
realtime_alerts_enabled = false
# U2: personalizowany fan-out per subskrybent (tabela `subscribers`). false =
# pojedyncza wysyłka na DIGEST_TO_EMAIL. U3: statyczny digest web (read-only).
subscriptions_enabled = false
web_digest_enabled = false
